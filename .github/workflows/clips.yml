name: Clip de vista previa

# El panel de /admin deja las peticiones en content/cola-clips.json y este
# workflow descarga el vídeo, corta el clip de 7 s y lo publica.
# Al hacer push del clip, Vercel redespliega solo.

on:
  push:
    paths:
      - "content/cola-clips.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar yt-dlp y ffmpeg
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp imageio-ffmpeg

      - name: Generar los clips en cola
        run: |
          python - <<'PY'
          import json, subprocess, sys, os

          COLA = "content/cola-clips.json"
          try:
              with open(COLA, encoding="utf-8") as f:
                  cola = json.load(f)
          except Exception:
              print("No hay cola que procesar")
              sys.exit(0)

          if not isinstance(cola, list) or not cola:
              print("Cola vacía")
              sys.exit(0)

          errores = []
          for item in cola:
              url = item.get("url")
              slug = item.get("slug")
              print("==>", slug, url, flush=True)
              orden = [sys.executable, "tools/add_preview.py", url,
                       "--slug", slug, "--force", "--no-push"]
              if item.get("inicio") is not None:
                  orden += ["--inicio", str(item["inicio"])]
              r = subprocess.run(orden)
              if r.returncode != 0:
                  errores.append(slug)

          with open("/tmp/errores.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(errores))
          print("Fallos:", errores or "ninguno")
          PY

      - name: Publicar los clips
        run: |
          git config user.name "Panel Marcos Donate"
          git config user.email "web@markos-films.local"

          # clips nuevos o modificados
          git add assets/video/preview
          # los que han fallado vuelven a la cola; el resto desaparece
          python - <<'PY'
          import json, os

          COLA = "content/cola-clips.json"
          with open(COLA, encoding="utf-8") as f:
              cola = json.load(f)

          fallos = []
          if os.path.exists("/tmp/errores.txt"):
              with open("/tmp/errores.txt", encoding="utf-8") as f:
                  fallos = [l.strip() for l in f if l.strip()]

          pendientes = [c for c in cola if c.get("slug") in fallos]
          with open(COLA, "w", encoding="utf-8") as f:
              f.write(json.dumps(pendientes, ensure_ascii=False, indent=2) + "\n")
          print("Quedan en cola:", [c["slug"] for c in pendientes] or "nada")
          PY

          git add content/cola-clips.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
            exit 0
          fi
          git commit -m "Clips de vista previa generados desde el panel"
          git push
