name: Limpiar despliegues de Vercel

on:
  push:
    branches: [main]
  schedule:
    # Todos los días a las 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo simular (no borra nada)"
        type: boolean
        default: false
      max_deployments:
        description: "Despliegues a conservar"
        type: string
        default: "15"

permissions:
  contents: read

concurrency:
  group: prune-vercel-deployments
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Comprobar el secreto VERCEL_TOKEN
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta el secreto VERCEL_TOKEN. Añádelo en Settings → Secrets and variables → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Esperar a que Vercel registre el despliegue
        # En un push, Vercel tarda un poco en crear el despliegue nuevo.
        if: github.event_name == 'push'
        run: sleep 120

      - name: Conservar los últimos despliegues
        if: steps.token.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: markos-films
          VERCEL_TEAM_SLUG: marcos-arranzs-projects
          MAX_DEPLOYMENTS: ${{ inputs.max_deployments || '15' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/prune-vercel-deployments.mjs
